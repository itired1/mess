app = "lilbrumessage"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  DB_PATH = "/data/db.json"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/data"